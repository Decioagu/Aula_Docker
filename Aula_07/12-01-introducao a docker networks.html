    <g transform="matrix(1,0,0,1,878.52,232.9)" ed:height="38.4" ed:parentid="101" ed:layout="rightmap" ed:width="227.8" id="126">
        <text class="st20">
            <tspan textLength="174" style="white-space:pre" x="20" y="27.5">Native Docker DNS</tspan>
        </text>
        <g ed:note="&lt;body style=&quot; font-family:'Arial'; font-size:12pt; font-weight:400; font-style:normal;&quot;>&lt;p style=&quot; margin-top:0px; margin-bottom:0px; margin-left:0px; margin-right:0px; -qt-block-indent:0; text-indent:0px; &quot;>O DNS nativo do Docker é um recurso que permite que os contêineres se comuniquem uns com os outros usando nomes de host em vez de endereços IP. O Docker fornece um servidor DNS interno que resolve automaticamente os nomes de host em endereços IP, permitindo que os contêineres se comuniquem uns com os outros usando nomes de host.&lt;/p>&lt;p style=&quot;-qt-paragraph-type:empty; margin-top:0px; margin-bottom:0px; margin-left:0px; margin-right:0px; -qt-block-indent:0; text-indent:0px; &quot;>&lt;br />&lt;/p>&lt;p style=&quot; margin-top:0px; margin-bottom:0px; margin-left:0px; margin-right:0px; -qt-block-indent:0; text-indent:0px; &quot;>Por exemplo, se você tiver dois contêineres em sua rede Docker, um chamado &amp;quot;webserver&amp;quot; e outro chamado &amp;quot;database&amp;quot;, você pode se referir a eles pelo nome em vez de pelo endereço IP. Isso torna a comunicação entre contêineres mais fácil e mais confiável.&lt;/p>&lt;p style=&quot;-qt-paragraph-type:empty; margin-top:0px; margin-bottom:0px; margin-left:0px; margin-right:0px; -qt-block-indent:0; text-indent:0px; &quot;>&lt;br />&lt;/p>&lt;p style=&quot; margin-top:0px; margin-bottom:0px; margin-left:0px; margin-right:0px; -qt-block-indent:0; text-indent:0px; &quot;>Para usar o DNS nativo do Docker, basta criar uma rede Docker e adicionar seus contêineres a essa rede. O Docker atribuirá automaticamente um nome de host exclusivo a cada contêiner e fornecerá um servidor DNS interno que resolverá esses nomes de host em endereços IP.&lt;/p>&lt;p style=&quot;-qt-paragraph-type:empty; margin-top:0px; margin-bottom:0px; margin-left:0px; margin-right:0px; -qt-block-indent:0; text-indent:0px; &quot;>&lt;br />&lt;/p>&lt;p style=&quot; margin-top:0px; margin-bottom:0px; margin-left:0px; margin-right:0px; -qt-block-indent:0; text-indent:0px; &quot;>Por exemplo, suponha que você tenha criado uma rede Docker chamada &amp;quot;my-network&amp;quot; e adicionado dois contêineres a essa rede, um chamado &amp;quot;webserver&amp;quot; e outro chamado &amp;quot;database&amp;quot;. Você pode se referir a esses contêineres pelo nome em vez de pelo endereço IP:&lt;/p>&lt;p style=&quot;-qt-paragraph-type:empty; margin-top:0px; margin-bottom:0px; margin-left:0px; margin-right:0px; -qt-block-indent:0; text-indent:0px; &quot;>&lt;br />&lt;/p>&lt;p style=&quot; margin-top:0px; margin-bottom:0px; margin-left:0px; margin-right:0px; -qt-block-indent:0; text-indent:0px; &quot;>```&lt;/p>&lt;p style=&quot; margin-top:0px; margin-bottom:0px; margin-left:0px; margin-right:0px; -qt-block-indent:0; text-indent:0px; &quot;>ping webserver.my-network&lt;/p>&lt;p style=&quot; margin-top:0px; margin-bottom:0px; margin-left:0px; margin-right:0px; -qt-block-indent:0; text-indent:0px; &quot;>ping database.my-network&lt;/p>&lt;p style=&quot; margin-top:0px; margin-bottom:0px; margin-left:0px; margin-right:0px; -qt-block-indent:0; text-indent:0px; &quot;>```&lt;/p>&lt;p style=&quot;-qt-paragraph-type:empty; margin-top:0px; margin-bottom:0px; margin-left:0px; margin-right:0px; -qt-block-indent:0; text-indent:0px; &quot;>&lt;br />&lt;/p>&lt;p style=&quot; margin-top:0px; margin-bottom:0px; margin-left:0px; margin-right:0px; -qt-block-indent:0; text-indent:0px; &quot;>O Docker resolverá automaticamente esses nomes de host em endereços IP e permitirá que os contêineres se comuniquem uns com os outros usando nomes de host.&lt;/p>&lt;/body>">
            <use transform="translate(195,12)" xlink:href="#imgnote"/>
        </g>

    <g transform="matrix(1,0,0,1,147.3,187.05)" ed:height="38.4" ed:parentid="101" ed:layout="leftmap" ed:width="332.6" id="128">
        <text class="st20">
            <tspan textLength="283" style="white-space:pre" x="20" y="27.5">Native Docker Network Drivers</tspan>
        </text>
        <g ed:note="&lt;body style=&quot; font-family:'Arial'; font-size:12pt; font-weight:400; font-style:normal;&quot;>&lt;p style=&quot; margin-top:0px; margin-bottom:0px; margin-left:0px; margin-right:0px; -qt-block-indent:0; text-indent:0px; &quot;>Com o Docker, é possível criar redes personalizadas para conectar contêineres. Para isso, o Docker oferece um conjunto de drivers de rede nativos que permitem aos usuários criar e gerenciar redes personalizadas de maneira fácil e eficiente.&lt;/p>&lt;p style=&quot;-qt-paragraph-type:empty; margin-top:0px; margin-bottom:0px; margin-left:0px; margin-right:0px; -qt-block-indent:0; text-indent:0px; &quot;>&lt;br />&lt;/p>&lt;p style=&quot; margin-top:0px; margin-bottom:0px; margin-left:0px; margin-right:0px; -qt-block-indent:0; text-indent:0px; &quot;>Os drivers de rede nativos do Docker incluem:&lt;/p>&lt;p style=&quot;-qt-paragraph-type:empty; margin-top:0px; margin-bottom:0px; margin-left:0px; margin-right:0px; -qt-block-indent:0; text-indent:0px; &quot;>&lt;br />&lt;/p>&lt;p style=&quot; margin-top:0px; margin-bottom:0px; margin-left:0px; margin-right:0px; -qt-block-indent:0; text-indent:0px; &quot;>- Bridge: é o driver de rede padrão do Docker e é usado para conectar contêineres em uma rede isolada. Ele permite que os contêineres se comuniquem entre si e também com a rede externa.&lt;/p>&lt;p style=&quot;-qt-paragraph-type:empty; margin-top:0px; margin-bottom:0px; margin-left:0px; margin-right:0px; -qt-block-indent:0; text-indent:0px; &quot;>&lt;br />&lt;/p>&lt;p style=&quot; margin-top:0px; margin-bottom:0px; margin-left:0px; margin-right:0px; -qt-block-indent:0; text-indent:0px; &quot;>- Host: o driver Host permite que um contêiner use a rede do host em que está sendo executado. Isso é útil quando um contêiner precisa ter acesso direto à rede do host, como em casos de depuração ou testes de rede.&lt;/p>&lt;p style=&quot;-qt-paragraph-type:empty; margin-top:0px; margin-bottom:0px; margin-left:0px; margin-right:0px; -qt-block-indent:0; text-indent:0px; &quot;>&lt;br />&lt;/p>&lt;p style=&quot; margin-top:0px; margin-bottom:0px; margin-left:0px; margin-right:0px; -qt-block-indent:0; text-indent:0px; &quot;>- Overlay: o driver Overlay é usado para conectar contêineres em várias máquinas em um cluster Docker Swarm. Ele cria uma rede virtual que permite que os contêineres se comuniquem entre si, independentemente da máquina em que estão sendo executados.&lt;/p>&lt;p style=&quot;-qt-paragraph-type:empty; margin-top:0px; margin-bottom:0px; margin-left:0px; margin-right:0px; -qt-block-indent:0; text-indent:0px; &quot;>&lt;br />&lt;/p>&lt;p style=&quot; margin-top:0px; margin-bottom:0px; margin-left:0px; margin-right:0px; -qt-block-indent:0; text-indent:0px; &quot;>- Macvlan: o driver Macvlan é usado para conectar contêineres a uma rede física. Ele permite que os contêineres tenham um endereço IP exclusivo na rede física e se comuniquem diretamente com outros dispositivos na rede.&lt;/p>&lt;p style=&quot;-qt-paragraph-type:empty; margin-top:0px; margin-bottom:0px; margin-left:0px; margin-right:0px; -qt-block-indent:0; text-indent:0px; &quot;>&lt;br />&lt;/p>&lt;p style=&quot; margin-top:0px; margin-bottom:0px; margin-left:0px; margin-right:0px; -qt-block-indent:0; text-indent:0px; &quot;>Para usar os drivers de rede nativos do Docker, basta especificar o driver correto ao criar uma rede personalizada. Por exemplo, para criar uma rede Bridge, você pode usar o seguinte comando:&lt;/p>&lt;p style=&quot;-qt-paragraph-type:empty; margin-top:0px; margin-bottom:0px; margin-left:0px; margin-right:0px; -qt-block-indent:0; text-indent:0px; &quot;>&lt;br />&lt;/p>&lt;p style=&quot; margin-top:0px; margin-bottom:0px; margin-left:0px; margin-right:0px; -qt-block-indent:0; text-indent:0px; &quot;>```&lt;/p>&lt;p style=&quot; margin-top:0px; margin-bottom:0px; margin-left:0px; margin-right:0px; -qt-block-indent:0; text-indent:0px; &quot;>docker network create --driver bridge minha-rede&lt;/p>&lt;p style=&quot; margin-top:0px; margin-bottom:0px; margin-left:0px; margin-right:0px; -qt-block-indent:0; text-indent:0px; &quot;>```&lt;/p>&lt;p style=&quot;-qt-paragraph-type:empty; margin-top:0px; margin-bottom:0px; margin-left:0px; margin-right:0px; -qt-block-indent:0; text-indent:0px; &quot;>&lt;br />&lt;/p>&lt;p style=&quot; margin-top:0px; margin-bottom:0px; margin-left:0px; margin-right:0px; -qt-block-indent:0; text-indent:0px; &quot;>Isso criará uma nova rede Bridge chamada &amp;quot;minha-rede&amp;quot;, que pode ser usada para conectar contêineres em um ambiente isolado e seguro.&lt;/p>&lt;p style=&quot;-qt-paragraph-type:empty; margin-top:0px; margin-bottom:0px; margin-left:0px; margin-right:0px; -qt-block-indent:0; text-indent:0px; &quot;>&lt;br />&lt;/p>&lt;p style=&quot; margin-top:0px; margin-bottom:0px; margin-left:0px; margin-right:0px; -qt-block-indent:0; text-indent:0px; &quot;>Em resumo, os drivers de rede nativos do Docker são uma maneira poderosa e flexível de criar e gerenciar redes personalizadas para seus contêineres. Com eles, é possível conectar contêineres em uma variedade de ambientes e cenários, desde redes isoladas até clusters Docker Swarm distribuídos.&lt;/p>&lt;/body>">
            <use transform="translate(300,12)" xlink:href="#imgnote"/>
        </g>
    </g>
    <g transform="matrix(1,0,0,1,163.3,66.85)" ed:height="38.4" ed:parentid="101" ed:layout="leftmap" ed:width="316.6" id="130">
        <text class="st20">
            <tspan textLength="264" style="white-space:pre" x="20" y="27.5">Non-Native Docker Networks</tspan>
        </text>
        <g ed:note="&lt;body style=&quot; font-family:'Arial'; font-size:12pt; font-weight:400; font-style:normal;&quot;>&lt;p style=&quot; margin-top:0px; margin-bottom:0px; margin-left:0px; margin-right:0px; -qt-block-indent:0; text-indent:0px; &quot;>Non-Native Docker Networks são soluções de rede desenvolvidas por terceiros para serem utilizadas com o Docker. Essas soluções não fazem parte do conjunto de drivers de rede nativos do Docker, mas podem ser integradas ao ecossistema Docker por meio de plugins. O objetivo dessas redes é fornecer funcionalidades adicionais, melhor desempenho, ou atender a requisitos específicos que os drivers nativos podem não ser capazes de fornecer.&lt;/p>&lt;p style=&quot;-qt-paragraph-type:empty; margin-top:0px; margin-bottom:0px; margin-left:0px; margin-right:0px; -qt-block-indent:0; text-indent:0px; &quot;>&lt;br />&lt;/p>&lt;p style=&quot; margin-top:0px; margin-bottom:0px; margin-left:0px; margin-right:0px; -qt-block-indent:0; text-indent:0px; &quot;>Alguns exemplos de Non-Native Docker Networks incluem:&lt;/p>&lt;p style=&quot;-qt-paragraph-type:empty; margin-top:0px; margin-bottom:0px; margin-left:0px; margin-right:0px; -qt-block-indent:0; text-indent:0px; &quot;>&lt;br />&lt;/p>&lt;p style=&quot; margin-top:0px; margin-bottom:0px; margin-left:0px; margin-right:0px; -qt-block-indent:0; text-indent:0px; &quot;>1. Weave: Uma solução de rede simples e resiliente que permite a comunicação entre contêineres em diferentes hosts. Weave cria uma rede virtual, permitindo que os contêineres se comuniquem como se estivessem na mesma rede física.&lt;/p>&lt;p style=&quot; margin-top:0px; margin-bottom:0px; margin-left:0px; margin-right:0px; -qt-block-indent:0; text-indent:0px; &quot;>   Site oficial: https://www.weave.works/oss/net/&lt;/p>&lt;p style=&quot;-qt-paragraph-type:empty; margin-top:0px; margin-bottom:0px; margin-left:0px; margin-right:0px; -qt-block-indent:0; text-indent:0px; &quot;>&lt;br />&lt;/p>&lt;p style=&quot; margin-top:0px; margin-bottom:0px; margin-left:0px; margin-right:0px; -qt-block-indent:0; text-indent:0px; &quot;>2. Calico: Uma solução de rede focada na segurança e escalabilidade, que usa o protocolo BGP para roteamento e oferece políticas de segurança de rede para contêineres.&lt;/p>&lt;p style=&quot; margin-top:0px; margin-bottom:0px; margin-left:0px; margin-right:0px; -qt-block-indent:0; text-indent:0px; &quot;>   Site oficial: https://www.projectcalico.org/&lt;/p>&lt;p style=&quot;-qt-paragraph-type:empty; margin-top:0px; margin-bottom:0px; margin-left:0px; margin-right:0px; -qt-block-indent:0; text-indent:0px; &quot;>&lt;br />&lt;/p>&lt;p style=&quot; margin-top:0px; margin-bottom:0px; margin-left:0px; margin-right:0px; -qt-block-indent:0; text-indent:0px; &quot;>3. Cilium: Uma solução de rede baseada em eBPF (Extended Berkeley Packet Filter) que fornece segurança, visibilidade e balanceamento de carga para aplicações baseadas em microserviços.&lt;/p>&lt;p style=&quot; margin-top:0px; margin-bottom:0px; margin-left:0px; margin-right:0px; -qt-block-indent:0; text-indent:0px; &quot;>   Site oficial: https://cilium.io/&lt;/p>&lt;p style=&quot;-qt-paragraph-type:empty; margin-top:0px; margin-bottom:0px; margin-left:0px; margin-right:0px; -qt-block-indent:0; text-indent:0px; &quot;>&lt;br />&lt;/p>&lt;p style=&quot; margin-top:0px; margin-bottom:0px; margin-left:0px; margin-right:0px; -qt-block-indent:0; text-indent:0px; &quot;>Para usar Non-Native Docker Networks, é necessário instalar o plugin apropriado e configurar o ambiente Docker de acordo com a documentação específica de cada solução. Depois de instalados e configurados, é possível criar e gerenciar redes usando comandos Docker semelhantes aos usados para drivers nativos.&lt;/p>&lt;/body>">
            <use transform="translate(284,12)" xlink:href="#imgnote"/>
        </g>
    </g>
    <g transform="matrix(1,0,0,1,1330.02,92.4)" ed:height="22" ed:parentid="124" ed:layout="rightmap" ed:width="78.8" id="132">
        <text class="st21">
            <tspan textLength="35" style="white-space:pre" x="11" y="16.9">bridge</tspan>
        </text>
        <g ed:note="&lt;body style=&quot; font-family:'Arial'; font-size:12pt; font-weight:400; font-style:normal;&quot;>&lt;p style=&quot; margin-top:0px; margin-bottom:0px; margin-left:0px; margin-right:0px; -qt-block-indent:0; text-indent:0px; &quot;>A rede bridge é a rede padrão do Docker, que conecta os contêineres a uma rede interna do Docker. Cada contêiner tem seu próprio endereço IP dentro da rede bridge, permitindo que eles se comuniquem uns com os outros. A rede bridge também permite que os contêineres se conectem à internet por meio de uma porta mapeada no host.&lt;/p>&lt;/body>">
            <use transform="translate(53,4)" xlink:href="#imgnote"/>
        </g>
    </g>
    <g transform="matrix(1,0,0,1,1330.02,120.9)" ed:height="22" ed:parentid="124" ed:layout="rightmap" ed:width="89.2" id="134">
        <text class="st21">
            <tspan textLength="47" style="white-space:pre" x="11" y="16.9">macvlan</tspan>
        </text>
        <g ed:note="&lt;body style=&quot; font-family:'Arial'; font-size:12pt; font-weight:400; font-style:normal;&quot;>&lt;p style=&quot; margin-top:0px; margin-bottom:0px; margin-left:0px; margin-right:0px; -qt-block-indent:0; text-indent:0px; &quot;>A rede macvlan permite que os contêineres tenham seu próprio endereço IP na rede física do host. Isso significa que cada contêiner é visto como um dispositivo independente na rede física, permitindo que eles sejam acessados diretamente de outros dispositivos na rede.&lt;/p>&lt;/body>">
            <use transform="translate(64,4)" xlink:href="#imgnote"/>
        </g>
    </g>
    <g transform="matrix(1,0,0,1,1330.02,149.4)" ed:height="22" ed:parentid="124" ed:layout="rightmap" ed:width="83.59999999999999" id="136">
        <text class="st21">
            <tspan textLength="40" style="white-space:pre" x="11" y="16.9">overlay</tspan>
        </text>
        <g ed:note="&lt;body style=&quot; font-family:'Arial'; font-size:16pt; font-weight:400; font-style:normal;&quot;>&lt;p style=&quot; margin-top:0px; margin-bottom:0px; margin-left:0px; margin-right:0px; -qt-block-indent:0; text-indent:0px;&quot;>&lt;span style=&quot; font-size:12pt;&quot;>A rede overlay permite que os contêineres se comuniquem em diferentes hosts Docker. Isso é útil para aplicativos distribuídos em vários hosts Docker, permitindo que os contêineres se comuniquem como se estivessem na mesma rede.&lt;/span>&lt;/p>&lt;/body>">
            <use transform="translate(58,4)" xlink:href="#imgnote"/>
        </g>
    </g>
    <g transform="matrix(1,0,0,1,1330.02,177.9)" ed:height="22" ed:parentid="124" ed:layout="rightmap" ed:width="66" id="138">
        <text class="st21">
            <tspan textLength="25" style="white-space:pre" x="11" y="16.9">host</tspan>
        </text>
        <g ed:note="&lt;body style=&quot; font-family:'Arial'; font-size:12pt; font-weight:400; font-style:normal;&quot;>&lt;p style=&quot; margin-top:0px; margin-bottom:0px; margin-left:0px; margin-right:0px; -qt-block-indent:0; text-indent:0px; &quot;>A rede host permite que os contêineres compartilhem a rede do host, permitindo que eles acessem diretamente os recursos da rede do host. Isso é útil para aplicativos que precisam de acesso direto à rede do host, como aplicativos de monitoramento de rede.&lt;/p>&lt;/body>">
            <use transform="translate(40,4)" xlink:href="#imgnote"/>
        </g>
    </g>
    <g transform="matrix(1,0,0,1,33.4,138.25)" ed:height="22" ed:parentid="128" ed:layout="leftmap" ed:width="78.8" id="140">
        <text class="st21">
            <tspan textLength="35" style="white-space:pre" x="11" y="16.9">bridge</tspan>
        </text>
        <g ed:note="&lt;body style=&quot; font-family:'Arial'; font-size:12pt; font-weight:400; font-style:normal;&quot;>&lt;p style=&quot; margin-top:0px; margin-bottom:0px; margin-left:0px; margin-right:0px; -qt-block-indent:0; text-indent:24px; &quot;>Uma bridge é a rede padrão em que o Docker executará os containers. &lt;/p>&lt;p style=&quot;-qt-paragraph-type:empty; margin-top:0px; margin-bottom:0px; margin-left:0px; margin-right:0px; -qt-block-indent:0; text-indent:24px; &quot;>&lt;br />&lt;/p>&lt;p style=&quot; margin-top:0px; margin-bottom:0px; margin-left:0px; margin-right:0px; -qt-block-indent:0; text-indent:24px; &quot;>Se nada for definido ao iniciar uma instância de container, o Docker usará a subnet por trás da interface docker0, na qual os containers receberão um endereço IP no subnet 172.17.0.0/16. &lt;/p>&lt;p style=&quot;-qt-paragraph-type:empty; margin-top:0px; margin-bottom:0px; margin-left:0px; margin-right:0px; -qt-block-indent:0; text-indent:24px; &quot;>&lt;br />&lt;/p>&lt;p style=&quot; margin-top:0px; margin-bottom:0px; margin-left:0px; margin-right:0px; -qt-block-indent:0; text-indent:24px; &quot;>Em uma rede bridge, os containers  têm conectividade de rede com outros containers no subnet da bridge, bem como  conectividade de saída para a internet. &lt;/p>&lt;/body>">
            <use transform="translate(53,4)" xlink:href="#imgnote"/>
        </g>
    </g>
    <g transform="matrix(1,0,0,1,46.2,166.75)" ed:height="22" ed:parentid="128" ed:layout="leftmap" ed:width="66" id="142">
        <text class="st21">
            <tspan textLength="25" style="white-space:pre" x="11" y="16.9">host</tspan>
        </text>
        <g ed:note="&lt;body style=&quot; font-family:'Arial'; font-size:12pt; font-weight:400; font-style:normal;&quot;>&lt;p style=&quot; margin-top:0px; margin-bottom:0px; margin-left:0px; margin-right:0px; -qt-block-indent:0; text-indent:24px; &quot;>Containers executando no modo host networking têm acesso direto ao network stack do docker host. &lt;/p>&lt;p style=&quot;-qt-paragraph-type:empty; margin-top:0px; margin-bottom:0px; margin-left:0px; margin-right:0px; -qt-block-indent:0; text-indent:0px; &quot;>&lt;br />&lt;/p>&lt;p style=&quot; margin-top:0px; margin-bottom:0px; margin-left:0px; margin-right:0px; -qt-block-indent:0; text-indent:24px; &quot;>Isso significa que todas as portas que estão expostas ao container também estão expostas às mesmas portas na máquina host que executa os containers. &lt;/p>&lt;p style=&quot;-qt-paragraph-type:empty; margin-top:0px; margin-bottom:0px; margin-left:0px; margin-right:0px; -qt-block-indent:0; text-indent:0px; &quot;>&lt;br />&lt;/p>&lt;p style=&quot; margin-top:0px; margin-bottom:0px; margin-left:0px; margin-right:0px; -qt-block-indent:0; text-indent:24px; &quot;>O container também tem visibilidade de todas as interfaces de rede físicas e virtuais em execução no host. &lt;/p>&lt;p style=&quot;-qt-paragraph-type:empty; margin-top:0px; margin-bottom:0px; margin-left:0px; margin-right:0px; -qt-block-indent:0; text-indent:0px; &quot;>&lt;br />&lt;/p>&lt;p style=&quot; margin-top:0px; margin-bottom:0px; margin-left:0px; margin-right:0px; -qt-block-indent:0; text-indent:24px; &quot;>A rede do host é geralmente preferida ao executar instâncias de container que consomem muita largura de banda ou utilizam múltiplos protocolos&lt;/p>&lt;/body>">
            <use transform="translate(40,4)" xlink:href="#imgnote"/>
        </g>
    </g>
    <g transform="matrix(1,0,0,1,23,195.25)" ed:height="22" ed:parentid="128" ed:layout="leftmap" ed:width="89.2" id="144">
        <text class="st21">
            <tspan textLength="47" style="white-space:pre" x="11" y="16.9">macvlan</tspan>
        </text>
        <g ed:note="&lt;body style=&quot; font-family:'Arial'; font-size:12pt; font-weight:400; font-style:normal;&quot;>&lt;p style=&quot; margin-top:0px; margin-bottom:0px; margin-left:0px; margin-right:0px; -qt-block-indent:0; text-indent:0px; &quot;>Redes macvlan criadas no Docker são usadas em cenários nos quais sua aplicação em container precisa de um endereço MAC e conectividade direta à rede subjacente. Ao usar uma rede macvlan, o Docker atribuirá um endereço MAC à instância do container por meio de uma interface física na máquina host. &lt;/p>&lt;p style=&quot;-qt-paragraph-type:empty; margin-top:0px; margin-bottom:0px; margin-left:0px; margin-right:0px; -qt-block-indent:0; text-indent:0px; &quot;>&lt;br />&lt;/p>&lt;p style=&quot; margin-top:0px; margin-bottom:0px; margin-left:0px; margin-right:0px; -qt-block-indent:0; text-indent:0px; &quot;>Isso faz com que o container pareça um host físico no segmento de rede implantado. Vale ressaltar que muitos ambientes de nuvem, como AWS, Azure e muitos hipervisores de virtualização, não permitem a configuração de redes macvlan em instâncias de container. Redes macvlan permitem que o Docker atribua endereços IP e endereços MAC dos containers às redes subjacentes com base em uma interface de rede física conectada à máquina host. &lt;/p>&lt;p style=&quot;-qt-paragraph-type:empty; margin-top:0px; margin-bottom:0px; margin-left:0px; margin-right:0px; -qt-block-indent:0; text-indent:0px; &quot;>&lt;br />&lt;/p>&lt;p style=&quot; margin-top:0px; margin-bottom:0px; margin-left:0px; margin-right:0px; -qt-block-indent:0; text-indent:0px; &quot;>O uso de redes macvlan pode facilmente levar ao esgotamento de endereços IP ou conflitos de endereços IP, se não configurado corretamente.&lt;/p>&lt;/body>">
            <use transform="translate(64,4)" xlink:href="#imgnote"/>
        </g>
    </g>
    <g transform="matrix(1,0,0,1,28.6,223.75)" ed:height="22" ed:parentid="128" ed:layout="leftmap" ed:width="83.59999999999999" id="146">
        <text class="st21">
            <tspan textLength="40" style="white-space:pre" x="11" y="16.9">overlay</tspan>
        </text>
        <g ed:note="&lt;body style=&quot; font-family:'Arial'; font-size:12pt; font-weight:400; font-style:normal;&quot;>&lt;p style=&quot; margin-top:0px; margin-bottom:0px; margin-left:0px; margin-right:0px; -qt-block-indent:0; text-indent:0px; &quot;>A rede overlay é como o Docker lida com a rede em um cluster de swarm.&lt;/p>&lt;p style=&quot;-qt-paragraph-type:empty; margin-top:0px; margin-bottom:0px; margin-left:0px; margin-right:0px; -qt-block-indent:0; text-indent:0px; &quot;>&lt;br />&lt;/p>&lt;p style=&quot; margin-top:0px; margin-bottom:0px; margin-left:0px; margin-right:0px; -qt-block-indent:0; text-indent:0px; &quot;>Quando um cluster Docker é definido entre os nós, o Docker usará a rede física que conecta os nós para definir uma rede lógica entre os contêineres em execução nos nós. &lt;/p>&lt;p style=&quot;-qt-paragraph-type:empty; margin-top:0px; margin-bottom:0px; margin-left:0px; margin-right:0px; -qt-block-indent:0; text-indent:0px; &quot;>&lt;br />&lt;/p>&lt;p style=&quot; margin-top:0px; margin-bottom:0px; margin-left:0px; margin-right:0px; -qt-block-indent:0; text-indent:0px; &quot;>Isso permite que os contêineres se comuniquem diretamente entre si nos nós do cluster.&lt;/p>&lt;/body>">
            <use transform="translate(58,4)" xlink:href="#imgnote"/>
        </g>
    </g>
    <g transform="matrix(1,0,0,1,41.4,252.25)" ed:height="22" ed:parentid="128" ed:layout="leftmap" ed:width="70.8" id="148">
        <text class="st21">
            <tspan textLength="28" style="white-space:pre" x="11" y="16.9">none</tspan>
        </text>
        <g ed:note="&lt;body style=&quot; font-family:'Arial'; font-size:12pt; font-weight:400; font-style:normal;&quot;>&lt;p style=&quot; margin-top:0px; margin-bottom:0px; margin-left:0px; margin-right:0px; -qt-block-indent:0; text-indent:0px; &quot;>A rede &amp;quot;none&amp;quot; não fornece conectividade de rede para contêineres implantados nessa rede. As instâncias de contêiner implantadas na rede &amp;quot;none&amp;quot; possuem apenas uma interface de loopback e não têm acesso a outros recursos de rede. &lt;/p>&lt;p style=&quot;-qt-paragraph-type:empty; margin-top:0px; margin-bottom:0px; margin-left:0px; margin-right:0px; -qt-block-indent:0; text-indent:0px; &quot;>&lt;br />&lt;/p>&lt;p style=&quot; margin-top:0px; margin-bottom:0px; margin-left:0px; margin-right:0px; -qt-block-indent:0; text-indent:0px; &quot;>Nenhum driver opera nessa rede. Os contêineres implantados usando o modo de rede &amp;quot;none&amp;quot; geralmente são aplicativos que operam em cargas de trabalho de armazenamento ou disco e não exigem conectividade de rede. &lt;/p>&lt;p style=&quot;-qt-paragraph-type:empty; margin-top:0px; margin-bottom:0px; margin-left:0px; margin-right:0px; -qt-block-indent:0; text-indent:0px; &quot;>&lt;br />&lt;/p>&lt;p style=&quot; margin-top:0px; margin-bottom:0px; margin-left:0px; margin-right:0px; -qt-block-indent:0; text-indent:0px; &quot;>Contêineres segregados da conectividade de rede por motivos de segurança também podem ser implantados usando esse driver de rede.&lt;/p>&lt;/body>">
            <use transform="translate(45,4)" xlink:href="#imgnote"/>
        </g>
    </g>
